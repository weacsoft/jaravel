server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:database1.sqlite
    driver-class-name: org.sqlite.JDBC

jaravel:
  # 视图引擎配置（jblade Blade 模板引擎）
  view:
    # 运行时编译模式（默认，需要 JDK）
    # 预编译模式（仅需 JRE，开发时用 BladePrecompilerMain 预编译模板）
    precompiled-mode: false
    # precompiled-package: precompiled/templates.jblade.zip  # 预编译打包文件路径
    # precompiled-classes-dir: precompiled/classes            # 预编译 class 目录路径
    template-dir: templates
    suffix: .blade.java
  # ===== 文件存储（Storage 多磁盘抽象） =====
  # 内置 local/public 驱动，以及扩展的 database 驱动（将文件存入关系型数据库）
  storage:
    enabled: true
    default-disk: db
    disks:
      # 数据库存储：多机共享同一个数据库即可同步文件；默认二进制(BLOB)存放
      db:
        driver: database
        visibility: private
        options:
          binary: true                 # true=BLOB 二进制；false=base64 文本(LONGTEXT)，用于不支持二进制的数据库
          chunk-size: 1048576          # 单条记录(分片)字节上限；超过则切分；设为 0 表示整文件单条存放
          table-prefix: storage_       # 数据表前缀，对应迁移脚本中的 storage_file / storage_file_chunk
      # 本地存储（保留，便于对比/兜底）
      local:
        driver: local
        root: storage/app
        visibility: private
      public:
        driver: public
        root: storage/app/public
        url: /storage
        visibility: public
  # Wire 部分更新模块（Laravel Livewire 风格）
  wire:
    auto-inject-js: true
    js-path: /static/wire.js
  auth:
    default-guard: api
  migration:
    enabled: true
    table: migrations
    auto-run: false
    source: classpath
  cache:
    # 多 cache store 演示：默认使用 array（内存），各模块可指定不同 store
    default-store: array
    prefix: jaravel
    # 按需配置 store（对齐 Laravel stores 数组）
    # 只有配置在此处的 store 才会被创建，驱动实例在创建时才实例化（用到才构建）
    # stores 为空时只创建 default-store 对应的默认 store
    stores:
      array:
        driver: array
      file:
        driver: file
        dir: ""                   # file 驱动目录（空则使用系统临时目录）
      database:
        driver: database
        table: jaravel_cache      # 需先执行 artisan cache:table 建表
    # 顶层快捷配置（向后兼容，stores 中未指定时回退到此）
    file-dir: ""
    database-table: jaravel_cache
  # ===== 多 Cache 模块级配置 =====
  # 各模块通过独立配置项指定 cache store，空串表示使用 cache 模块的默认 store
  # wechat 模块使用 file store（跨重启持久化 access_token）
  wechat:
    cache-store: "file"
    # ... 其他 wechat 配置
  # model-cache 模块使用 database store（需先执行 artisan cache:table）
  model-cache:
    store: "database"
    default-ttl: 3600
  # jwt 模块使用 array store（内存即可，重启后 token 自然过期）
  jwt:
    secret: jaravel-secret-key-change-in-production-must-be-32-bytes
    ttl: 3600000
    refresh-ttl: 604800000
    refresh-enabled: true
    blacklist-prefix: "jwt:blacklist:"
    blacklist-store: "array"
  # ===== 队列配置 =====
  # 默认使用 sync（内存队列），无需数据库表
  # 切换到 database 驱动需先执行 artisan queue:table 建表
  queue:
    driver: sync                      # sync（默认，内存队列）| database | redis
    failed-job-retention-days: 7
    database:
      table: jobs
      retry-after: 1800
      max-attempts: 3
      retry-delay-ms: 5000
      poll-interval-ms: 1000
      worker-threads: 1
      auto-start: false
      # 多队列消费：worker 启动后消费以下队列
      queues:
        - default
        - emails
        - payments
        - invoices
  # ===== 事件队列配置（多队列线程池） =====
  event:
    queue-enabled: true
    queue:
      default-pool-size: 4           # 默认队列线程池大小
      # 各命名队列独立线程池大小，互不阻塞
      queue-pool-sizes:
        emails: 2
        payments: 2
        invoices: 1
    retry:
      max-attempts: 3
      delay-ms: 1000
  # 插件系统配置
  plugin-jar:
    enabled: true
    plugins-dir: plugins
    auto-restore: false
    auto-register: true
    # 多租户插件支持
    multi-tenant:
      enabled: true
      separator: "@"
    # 远程插件执行 P2SP
    remote:
      server:
        enabled: false
        port: 9700
        auth-token: "jaravel-remote-secret"
        node-id: "node-root"
        relay-enabled: false
        max-hops: 5
      client:
        enabled: true
        transport: tcp
        http-endpoint: /rpc
        tree-routing-enabled: false
        max-hops: 5
  plugin-java:
    enabled: true
    source-dir: plugins-java
    auto-scan: true
    auto-register: true

  # Artisan CLI 命令框架
  artisan:
    enabled: true
    make:
      base-package: com.weacsoft.jaravel
      output-dir: src/main/java

  # 定时任务调度器
  schedule:
    enabled: true

  # Redis 连接管理（未安装 Redis 时不影响应用启动）
  redis:
    options:
      cluster: redis
      prefix: "jaravel_"
    connections:
      default:
        host: 127.0.0.1
        port: 6379

  # 验证码配置（项目自带 captcha 模块）
  captcha:
    enabled: true
    width: 300
    height: 150
    length: 4                    # 数字/算术验证码字符数量
    expire-seconds: 300
    tolerance: 8.0
    trajectory-enabled: true
    # 干扰强度级别 1-5（1=极轻, 3=中等, 5=极强）
    interference-level: 3
    # 字体配置（null=自动检测系统字体）
    font-family: null
    cjk-font-family: null        # 中文字体，null=自动检测系统可用字体
    font-path: null              # 自定义字体文件路径(.ttf/.otf)
    # 点选验证码配置
    click-target-count: 3        # 需要点选的目标文字数量
    click-decoy-count: 3         # 干扰文字数量
    # 数据加密配置（none=不加密纯Base64, aes=AES/CBC, rsa=RSA/OAEP）
    encryption-type: aes
    encryption-key: jaravel-captcha-default-key  # 生产环境请修改
    # 自定义背景图（滑动/旋转验证码，支持多张随机选择）
    # background-images:
    #   - classpath:captcha/bg1.jpg
    #   - classpath:captcha/bg2.jpg

logging:
  level:
    com.weacsoft.jaravel: INFO
    gaarason.database: INFO
