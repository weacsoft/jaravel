# =============================================================================
# Jaravel 应用配置
# =============================================================================
# 【核心原则：安装 ≠ 启用】
#   引入某个模块的依赖，不代表它的驱动会被装配进内存。
#   只有"用到了"（显式写了对应 driver，或触发了兜底默认）才会真正创建 Bean。
#   好处：不用 Redis 就不会连 Redis；不用数据库就不会因缺 DataSource 而启动失败。
#
# 【三层优先级：声明 -> 配置 -> 默认】
#   1. 声明：Java 配置类里的 @RegisterXxx 注解（见 src/main/java/.../config/），优先级最高，同名覆盖配置
#   2. 配置：本文件的 yml 配置
#   3. 默认：都没写时，各模块用自己的兜底默认值，保证功能基本可用
#
# 【各模块兜底默认值】
#   auth     -> session         queue    -> sync（同步执行）
#   cache    -> array（内存）    storage  -> local（本地目录）
#   session  -> cookie          database -> 无兜底，未配置却使用则直接报错
#   jwt      -> 不参与兜底，必须显式写 driver: jwt 才装配
#
# 本文件已按 Laravel 风格把常用配置方式都写出来，未启用的以注释保留，方便对照切换。
# =============================================================================

server:
  port: 8080

# ===== 数据库连接 =====
# database 模块没有兜底默认：不配就不建连接（应用仍能启动），但用 DB/Model 会直接报错。
# 多数据源请改用 DatabaseConfig 的 @RegisterConnection（别名与 bean name 解耦）。
spring:
  datasource:
    url: jdbc:sqlite:database1.sqlite
    driver-class-name: org.sqlite.JDBC
    # username: ""
    # password: ""

jaravel:
  # 全局应用密钥（由 `artisan key:generate` 生成，Base64 编码 32 字节）
  # captcha / jwt / http-cookies 等模块未单独配置密钥时统一回退到此密钥
  key: kF+bqyeMahQ+Inv0gbMDoH0MMC5F9AhBXrhUb8y4cPM=
  # 视图引擎配置（jblade Blade 模板引擎）
  # 新设计：框架只依赖 View 抽象，通过 @RegisterView 声明 + 本配置选择 + jblade 兜底注册。
  # 控制器用 ResponseBuilder.view(...) 渲染时由 ViewFacade 自动取当前激活实现，无需手动 setBladeEngine。
  view:
    # 默认激活的 View 实现名（对应 @RegisterView(name=...)）。不填则用声明中 defaultView=true 的那个。
    # default: blade
    template-dir: templates
    suffix: .blade.java
    asset-url-prefix: /static
    # 预编译模式（仅需 JRE）：在 ViewConfig 中将 @RegisterView 换成 precompiledPackage/precompiledClasses 写法
    # precompiled-package: precompiled/templates.jblade.zip   # 预编译打包文件路径
    # precompiled-classes-dir: precompiled/classes            # 预编译 class 目录路径
  # ===== 文件存储（Storage 多磁盘抽象） =====
  # 内置 local/public 驱动，以及扩展的 database 驱动（将文件存入关系型数据库）
  # 驱动按需装配：
  #   - LocalFilesystemDriver   ：有 driver: local/public，或一个 driver 都没写（兜底）时装配
  #   - DatabaseFilesystemDriver：严格按需，必须显式 driver: database 才装配（此时才需要 DataSource + storage_ 系列表）
  # 磁盘写了但没写 driver -> 兜底为 local。
  storage:
    enabled: true
    default-disk: db
    disks:
      # 数据库存储：多机共享同一个数据库即可同步文件；默认二进制(BLOB)存放
      db:
        driver: database
        visibility: private
        options:
          binary: true                 # true=BLOB 二进制；false=base64 文本(LONGTEXT)，用于不支持二进制的数据库
          chunk-size: 1048576          # 单条记录(分片)字节上限；超过则切分；设为 0 表示整文件单条存放
          table-prefix: storage_       # 数据表前缀，对应迁移脚本中的 storage_file / storage_file_chunk
      # 本地存储（保留，便于对比/兜底）
      local:
        driver: local
        root: storage/app
        visibility: private
      public:
        driver: public
        root: storage/app/public
        url: /storage
        visibility: public
      # 不写 driver 时兜底为 local：
      # tmp:
      #   root: storage/tmp
      # 自定义驱动（需自行实现 FilesystemDriver 并 @RegisterFilesystemDriver("oss")）：
      # oss:
      #   driver: oss
      #   options:
      #     bucket: my-bucket
  # Wire 部分更新模块（Laravel Livewire 风格）
  wire:
    auto-inject-js: true
    js-path: /static/js/wire-lib.js?v=2
    # 命名组件注册（名称 -> 模板）。也可在启动期用 WireComponents.register(name, template) 注册。
    components:
      toast: components.toast
      confirm: components.confirm
    # 命名组件加载位置（Outlet）配置
    outlet:
      enabled: true
      position: body-end            # body-end（默认，插到 </body> 前）| body-start（插到 <body> 后）
      auto-inject-js: true          # 是否自动注入 wire-component.js
      js-path: /static/wire-component.js
      except:                       # 不注入加载位置的路径，支持精确 /login 与前缀通配 /admin/*
        - /login
        - /blade-demo               # 示例：该页不需要命名组件，跳过 outlet 与运行时注入
        - /demo/storage/*           # 示例：前缀通配，下载/预览等非 HTML 响应一并排除
  # ===== PJAX 无感页面切换 =====
  # 零侵入：控制器与模板都不需要改动，只要在根路由挂上 PjaxMiddleware（见 RouteServiceProvider）。
  #   - 首次直接访问某页面   -> 返回带区域锚点 + pjax.js 的完整 HTML（SEO / 首屏不受影响）
  #   - 从已加载页面点链接过来 -> 只返回指纹发生变化的区域，未变化区域的 DOM 完全不动
  #   - 布局不同 / 区域集合对不上 -> 自动回退整页跳转，保证渲染结果绝对正确
  pjax:
    enabled: true
    auto-inject-js: true
    js-path: /static/js/pjax.js
    # 永不参与替换的区域名（这些区域始终保留页面上的原有 DOM）
    excluded-regions: []
    # 不纳入 PJAX 管辖的路径前缀（静态资源与接口）
    excluded-prefixes:
      - /api
      - /static
      - /assets
      - /storage
  # ===== 认证（auth） =====
  # 本项目的 guards / providers 用【声明式】写在 AuthConfig.java 里（优先级最高）。
  # 这里只覆盖默认守卫名。
  #
  # auth 模块自身始终启用（否则 Auth 静态门面会 NPE），但【具体驱动按需装配】：
  #   - SessionGuardDriver：出现 driver: session，或一个 driver 都没写（兜底）时装配
  #   - JwtGuardDriver    ：严格按需，必须显式 driver: jwt 才装配（JWT 不参与兜底）
  auth:
    default-guard: api
    # ---- 配置式写法（与 AuthConfig.java 二选一，注解优先） ----
    # providers:
    #   users:
    #     driver: eloquent
    #     model: com.weacsoft.jaravel.app.model.User
    #     credential-field: number
    #   admins:
    #     driver: eloquent
    #     model: com.weacsoft.jaravel.app.model.admin.Admin
    #     credential-field: username
    # guards:
    #   web:   { driver: session, provider: users }
    #   api:   { driver: jwt,     provider: users }
    #   admin: { driver: jwt,     provider: admins }
    #   simple: { provider: users }        # 不写 driver -> 兜底 session

  # ===== Session 存储（全局，不与 Guard 绑定） =====
  # 不写任何配置时兜底为 cookie（Servlet HttpSession），本项目即用兜底。
  # 引入 session-redis 依赖后，只有写了 driver: redis 才会装配 RedisSessionStore。
  # session:
  #   driver: redis            # cookie（兜底默认）| redis
  #   lifetime: 30             # 分钟
  #   prefix: "session"
  #   connection: default      # 用 jaravel.redis.connections 里的哪个连接

  migration:
    enabled: true
    table: migrations
    auto-run: true
    source: classpath
  # ===== 缓存（Cache 多 Store 抽象） =====
  # 驱动按需装配：只有配置在 stores 里的 store 才会创建，驱动实例在 store 创建时才实例化。
  #   - database 驱动：出现 driver: database 才装配（此时才需要 DataSource + jaravel_cache 表）
  #   - redis 驱动   ：出现 driver: redis 才装配（引入 jaravel-redis 也不会主动连接）
  # 一个 store 都不配时兜底为 array（内存）。
  cache:
    # 多 cache store 演示：默认使用 array（内存），各模块可指定不同 store
    default-store: array
    prefix: jaravel
    # 按需配置 store（对齐 Laravel stores 数组）
    # 只有配置在此处的 store 才会被创建，驱动实例在创建时才实例化（用到才构建）
    # stores 为空时只创建 default-store 对应的默认 store
    stores:
      array:
        driver: array
      file:
        driver: file
        dir: ""                   # file 驱动目录（空则使用系统临时目录）
      database:
        driver: database
        table: jaravel_cache      # 需先执行 artisan cache:table 建表
      # Redis store（需引入 jaravel-redis；不写则 Redis 缓存驱动完全不装配）：
      # redis:
      #   driver: redis
      #   connection: default
    # 顶层快捷配置（向后兼容，stores 中未指定时回退到此）
    file-dir: ""
    database-table: jaravel_cache
  # ===== 多 Cache 模块级配置 =====
  # 各模块通过独立配置项指定 cache store，空串表示使用 cache 模块的默认 store
  # wechat 模块使用 file store（跨重启持久化 access_token）
  wechat:
    cache-store: "file"
    # ... 其他 wechat 配置
  # model-cache 模块使用 database store（需先执行 artisan cache:table）
  model-cache:
    store: "database"
    default-ttl: 3600
  # jwt 模块使用 array store（内存即可，重启后 token 自然过期）
  # 注意：JWT 不参与兜底。JwtGuardDriver 只有在某个 guard 显式写了 driver: jwt 时才装配；
  #      本项目的 api / admin 守卫在 AuthConfig.java 中声明了 driver=jwt，所以会装配。
  jwt:
    secret: jaravel-secret-key-change-in-production-must-be-32-bytes
    ttl: 3600000
    refresh-ttl: 604800000
    refresh-enabled: true
    blacklist-prefix: "jwt:blacklist:"
    blacklist-store: "array"
  # ===== 队列配置 =====
  # 默认使用 sync（当前线程同步执行），无需数据库表、无需 Redis
  # 驱动严格按需装配，且【没有 redis <-> database 的互相回退】：写谁装配谁，都不写走 sync 兜底
  #   - driver: database -> 需先执行 artisan queue:table 建表（jobs / failed_jobs）
  #   - driver: redis    -> 需引入 jaravel-redis
  queue:
    driver: sync                      # sync（兜底默认）| database | redis
    failed-job-retention-days: 7
    database:
      table: jobs
      retry-after: 1800
      max-attempts: 3
      retry-delay-ms: 5000
      poll-interval-ms: 1000
      worker-threads: 1
      auto-start: false
      # 多队列消费：worker 启动后消费以下队列
      queues:
        - default
        - emails
        - payments
        - invoices
    # Redis 队列配置（driver: redis 时生效；不写 driver: redis 则完全不装配）
    # redis:
    #   connection: default
    #   queue: default
    #   block-for-seconds: 5
  # ===== 事件队列配置（多队列线程池） =====
  event:
    queue-enabled: true
    queue:
      default-pool-size: 4           # 默认队列线程池大小
      # 各命名队列独立线程池大小，互不阻塞
      queue-pool-sizes:
        emails: 2
        payments: 2
        invoices: 1
    retry:
      max-attempts: 3
      delay-ms: 1000
  # 插件系统配置
  plugin-jar:
    enabled: true
    plugins-dir: plugins
    auto-restore: false
    auto-register: true
    # 多租户插件支持
    multi-tenant:
      enabled: true
      separator: "@"
    # 远程插件执行 P2SP
    remote:
      server:
        enabled: false
        port: 9700
        auth-token: "jaravel-remote-secret"
        node-id: "node-root"
        relay-enabled: false
        max-hops: 5
      client:
        enabled: true
        transport: tcp
        http-endpoint: /rpc
        tree-routing-enabled: false
        max-hops: 5
  plugin-java:
    enabled: true
    source-dir: plugins-java
    auto-scan: true
    auto-register: true

  # Artisan CLI 命令框架
  artisan:
    enabled: true
    make:
      base-package: com.weacsoft.jaravel
      output-dir: src/main/java

  # 定时任务调度器
  schedule:
    enabled: true

  # ===== Redis 连接管理 =====
  # 这里只是"连接信息登记"，不代表会去连。安装 ≠ 启用：
  # 只有某个模块显式写了 driver: redis（session / cache / queue）时，
  # 对应的 Redis 驱动才会装配并使用下面的连接；都不写则完全不建连，不影响启动。
  redis:
    options:
      cluster: redis
      prefix: "jaravel_"
    connections:
      default:
        host: 127.0.0.1
        port: 6379

  # 验证码配置（项目自带 captcha 模块）
  captcha:
    enabled: true
    width: 300
    height: 150
    length: 4                    # 数字/算术验证码字符数量
    expire-seconds: 300
    tolerance: 8.0
    trajectory-enabled: true
    # 干扰强度级别 1-5（1=极轻, 3=中等, 5=极强）
    interference-level: 3
    # 字体配置（null=自动检测系统字体）
    font-family: null
    cjk-font-family: null        # 中文字体，null=自动检测系统可用字体
    font-path: null              # 自定义字体文件路径(.ttf/.otf)
    # 点选验证码配置
    click-target-count: 3        # 需要点选的目标文字数量
    click-decoy-count: 3         # 干扰文字数量
    # 数据加密配置（none=不加密纯Base64, aes=AES/CBC, rsa=RSA/OAEP）
    encryption-type: aes
    encryption-key: jaravel-captcha-default-key  # 生产环境请修改
    # 自定义背景图（滑动/旋转验证码，支持多张随机选择）
    # background-images:
    #   - classpath:captcha/bg1.jpg
    #   - classpath:captcha/bg2.jpg
    # ------------------------------------------------------------------
    # 场景白名单：前端只能通过 ?scene=<name> 从下列已声明场景中「选择」，
    # 不能传 tolerance / length / clickTargetCount 等任何具体数值。
    # 未命中白名单的场景名一律回落到上面的全局默认配置，不会降低难度。
    # 场景中未声明的字段自动继承全局配置。
    # ------------------------------------------------------------------
    scenes:
      login:
        description: 登录场景 — 更小容差、更强干扰
        tolerance: 5.0
        interference-level: 4
      register:
        description: 注册场景 — 点选 6 个文字
        click-target-count: 6
        click-decoy-count: 4
      comment:
        description: 评论场景 — 干扰较弱，字符数 4
        length: 4
        interference-level: 2
      demo-arithmetic:
        description: 演示用 — 算术验证码 5 位结果
        length: 5

logging:
  level:
    com.weacsoft.jaravel: INFO
    gaarason.database: INFO
